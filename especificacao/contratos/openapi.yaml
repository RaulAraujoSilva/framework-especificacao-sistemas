components:
  securitySchemes:
    sessao:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: Sessão do NextAuth (JWT em cookie httpOnly) para as telas
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mesmo JWT, para chamadas de sistema da concessionária

  parameters:
    CicloId: {name: ciclo_id, in: path, required: true, schema: {type: string, format: uuid}}
    PleitoId: {name: pleito_id, in: path, required: true, schema: {type: string, format: uuid}}
    ContratoId: {name: contrato_id, in: path, required: true, schema: {type: string, format: uuid}}
    Versao: {name: versao, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}, description: 'Código da versão contratual, ex.: 3TA-2024'}
    PecaId: {name: peca_id, in: path, required: true, schema: {type: string, format: uuid}}
    MinutaId: {name: minuta_id, in: path, required: true, schema: {type: string, format: uuid}}
    RemessaId: {name: remessa_id, in: path, required: true, schema: {type: string, format: uuid}}
    Pagina: {name: pagina, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PorPagina: {name: por_pagina, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Chave gerada pelo cliente por envio. Mesma chave e mesmo conteúdo devolvem a resposta original; mesma chave e conteúdo diferente dão 409. Guardada por 30 dias.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
      description: ETag lido no GET; evita sobrescrever alteração concorrente (412 se mudou)

  responses:
    RequisicaoInvalida:
      description: Corpo ou parâmetro malformado (JSON inválido, multipart sem a parte pleito)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    NaoAutenticado:
      description: Sem sessão válida
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    SemPermissao:
      description: Perfil sem permissão para a operação
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    NaoEncontrado:
      description: Recurso inexistente ou de outra concessionária
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    NaoAceitavel:
      description: Formato pedido no Accept não disponível
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    Conflito:
      description: Conflito de estado (pacote já enviado com o mesmo SHA-256, chave de idempotência reutilizada com outro conteúdo, ciclo já aberto)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    PreCondicaoFalhou:
      description: If-Match diferente do ETag atual
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    MuitoGrande:
      description: Pacote acima do limite
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    TipoNaoSuportado:
      description: Content-Type não aceito
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    CampoForaDoLayout:
      description: 'Propriedade fora do layout (codigo campo-fora-do-layout) ou dado pessoal detectado (codigo dado-pessoal); recusado sem guardar nada (RNF-05)'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    RegraDeNegocio:
      description: Operação contrária a uma regra de negócio (RN-*); o problema diz qual
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    MuitasRequisicoes:
      description: Limite de chamadas excedido
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    FonteIndisponivel:
      description: Fonte externa fora do ar e sem cache utilizável
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}

  schemas:
    Problema:
      type: object
      description: RFC 9457 (problem+json)
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference, examples: ['/problemas/campo-fora-do-layout']}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        codigo: {type: string, description: 'Código estável, ex.: campo-fora-do-layout, idempotencia-conflito, regra-negocio'}
        regra: {type: string, description: 'RN-* violada, quando houver'}
        erros:
          type: array
          items:
            type: object
            required: [mensagem]
            properties:
              campo: {type: string, description: JSON Pointer}
              mensagem: {type: string}
        correlacao_id: {type: string}
    Pagina:
      type: object
      required: [itens, pagina, por_pagina, total]
      properties:
        itens: {type: array, items: {}}
        pagina: {type: integer}
        por_pagina: {type: integer}
        total: {type: integer}
    Mes: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}
    ProcessoSei: {type: string, pattern: '^SEI-\d{6}/\d{6}/\d{4}$', examples: ['SEI-480002/009982/2025']}
    CodigoPerfil: {enum: [PER-CON, PER-ANA, PER-GCA, PER-PRO, PER-SEC, PER-REL, PER-GES, PER-ADM]}
    SituacaoCiclo: {description: 'Estados do ciclo (04_CASOS_DE_USO.md §5; enum SituacaoCiclo do prisma/schema.prisma em minúsculas)', enum: [protocolado, em_validacao, devolvido, a_reconferir, em_analise_tecnica, em_analise_juridica, em_instrucao, em_razoes_finais, apto_para_pauta, decidido_em_reuniao_interna, pautado, deliberado, publicado, em_prazo_recursal, aguardando_encerramento, encerrado, arquivado]}
    SubsituacaoCiclo: {description: 'Subestados de em_instrucao e aguardando_encerramento', enum: [avaliando_instrucao, em_diligencia, aguardando_resposta, em_conciliacao, acesso_aos_autos, conferindo_faturas, lista_completa, consulta_juridica]}
    SituacaoPrazo: {enum: [correndo, a_vencer, vencido, cumprido, suspenso, prorrogado]}
    ResultadoTeste: {enum: [conforme, nao_conforme, sem_evidencia, nao_aplicavel]}
    TipoMinuta: {enum: [parecer_tecnico, parecer_juridico, relatorio, voto, deliberacao]}
    TipoMarco:
      enum: [protocolo, validacao, devolucao, parecer_tecnico, parecer_juridico, diligencia, reiteracao, conciliacao, acesso_autos, razoes_finais, decisao_reuniao_interna, inclusao_pauta, deliberacao, publicacao, notificacao, divulgacao, envio_alerj, vigencia_tarifa, recurso, conferencia_faturas, parecer_arquivamento, certidao_ausencia_recurso, encerramento]
    CicloNovo:
      type: object
      required: [contrato_id, vigencia_pretendida]
      additionalProperties: false
      properties:
        contrato_id: {type: string, format: uuid}
        vigencia_pretendida: {type: string, format: date}
        processo_sei: {$ref: '#/components/schemas/ProcessoSei'}
    CicloResumo:
      type: object
      required: [id, contrato, vigencia_pretendida, situacao, dono, idade_dias_uteis]
      properties:
        id: {type: string, format: uuid}
        processo_sei: {type: [string, 'null']}
        contrato: {type: object, properties: {id: {type: string, format: uuid}, numero: {type: string}, concessionaria: {type: string}}}
        vigencia_pretendida: {type: string, format: date}
        situacao: {$ref: '#/components/schemas/SituacaoCiclo'}
        dono: {$ref: '#/components/schemas/Dono'}
        proximo_prazo: {oneOf: [{$ref: '#/components/schemas/Prazo'}, {type: 'null'}]}
        idade_dias_uteis: {type: number}
        erros: {type: integer}
        avisos: {type: integer}
    Ciclo:
      allOf:
        - $ref: '#/components/schemas/CicloResumo'
        - type: object
          properties:
            versao_contratual: {type: [string, 'null']}
            mes_o: {oneOf: [{$ref: '#/components/schemas/Mes'}, {type: 'null'}]}
            mes_i: {oneOf: [{$ref: '#/components/schemas/Mes'}, {type: 'null'}]}
            pleito_atual_id: {type: [string, 'null'], format: uuid}
            apuracao_id: {type: [string, 'null'], format: uuid}
            marcos: {type: array, items: {$ref: '#/components/schemas/Marco'}}
            prazos: {type: array, items: {$ref: '#/components/schemas/Prazo'}}
            pendencias: {type: array, items: {$ref: './resultado_validacao.schema.json#/$defs/item'}}
    Dono:
      type: object
      required: [unidade, desde]
      properties:
        unidade: {type: string}
        usuario_id: {type: [string, 'null'], format: uuid}
        desde: {type: string, format: date-time}
    CicloHistorico:
      type: object
      required: [ciclo_id, vigencia, mes_o, mes_i]
      properties:
        ciclo_id: {type: string, format: uuid}
        processo_sei: {type: [string, 'null']}
        vigencia: {type: string, format: date}
        versao_contratual: {type: string}
        mes_o: {$ref: '#/components/schemas/Mes'}
        mes_i: {$ref: '#/components/schemas/Mes'}
        ir_declarado_pct: {type: [number, 'null']}
        ir_refeito_pct: {type: [number, 'null']}
        ir_deliberado_pct: {type: [number, 'null']}
        total_deliberado_pct: {type: [number, 'null']}
        ato: {type: [string, 'null']}
        encadeia_com_anterior: {type: [boolean, 'null'], description: 'mes_o igual ao mes_i do ciclo anterior (RN-CAL-07)'}
        meses_acumulados: {type: [integer, 'null']}
    PacotePleito:
      type: object
      required: [pleito]
      properties:
        pleito: {$ref: './pleito_reajuste.schema.json'}
        anexos:
          type: array
          items: {type: string, format: binary}
          description: 'series.csv, energia.csv, tabela_tarifaria.csv, evidências, memória de cálculo, publicação; nomes iguais aos de pleito.anexos[].arquivo'
        canal: {enum: [direto, sei], default: direto, description: 'sei = pacote importado do peticionamento do SEI pela Secretaria (DEC-03)'}
        processo_sei: {$ref: '#/components/schemas/ProcessoSei'}
    PleitoRegistro:
      type: object
      required: [id, ciclo_id, recebido_em, sha256, canal, rodada]
      properties:
        id: {type: string, format: uuid}
        ciclo_id: {type: string, format: uuid}
        recebido_em: {type: string, format: date-time}
        enviado_por: {type: string, format: uuid}
        canal: {enum: [direto, sei]}
        rodada: {type: integer, minimum: 1, description: 'Número do envio no ciclo'}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        anexos:
          type: array
          items:
            type: object
            required: [arquivo, sha256, confere]
            properties:
              arquivo: {type: string}
              tipo: {type: string}
              sha256: {type: string}
              confere: {type: boolean, description: 'SHA-256 calculado igual ao declarado'}
        resultado: {oneOf: [{$ref: './resultado_validacao.schema.json'}, {type: 'null'}]}
    ContratoNovo:
      type: object
      required: [numero, nome, concessionaria_cnpj, servico]
      additionalProperties: false
      properties:
        numero: {type: string, examples: ['008/2014']}
        nome: {type: string, examples: ['Contrato de Concessão nº 008/2014']}
        concessionaria_cnpj: {type: string, pattern: '^\d{14}$'}
        servico: {enum: [saneamento, resíduos sólidos]}
    Contrato:
      allOf:
        - $ref: '#/components/schemas/ContratoNovo'
        - type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
            concessionaria: {type: string}
            versao_vigente: {type: [string, 'null']}
            proxima_data_base: {type: [string, 'null'], format: date}
    VersaoRegistro:
      type: object
      required: [contrato_id, versao, situacao, conteudo]
      properties:
        contrato_id: {type: string, format: uuid}
        versao: {type: string}
        situacao: {enum: [rascunho, publicada, substituida]}
        resolvida: {type: boolean}
        conteudo: {$ref: './cadastro_contrato.schema.json#/$defs/versao'}
        conferencia: {$ref: '#/components/schemas/ConferenciaTrechos'}
        criado_por: {type: string, format: uuid}
        publicado_em: {type: [string, 'null'], format: date-time}
    ConferenciaTrechos:
      type: object
      required: [conferido_em, achados, nao_achados]
      properties:
        conferido_em: {type: string, format: date-time}
        achados: {type: integer}
        nao_achados: {type: integer}
        fontes:
          type: array
          items:
            type: object
            required: [documento, parametro, achado]
            properties:
              documento: {type: string}
              parametro: {type: string}
              achado: {type: boolean}
    Apuracao:
      allOf:
        - $ref: './resultado_validacao.schema.json#/$defs/apuracao_resumo'
        - type: object
          properties:
            pleito_id: {type: string, format: uuid}
            versao_contratual: {type: string}
            versao_regras: {type: string}
            calculada_em: {type: string, format: date-time}
    MemoriaCalculo:
      type: object
      required: [apuracao, linhas]
      properties:
        apuracao: {$ref: '#/components/schemas/Apuracao'}
        linhas:
          type: array
          items:
            type: object
            required: [descricao, valor, origem]
            properties:
              descricao: {type: string}
              valor: {type: [number, string]}
              origem:
                type: object
                required: [tipo]
                properties:
                  tipo: {enum: [pleito, serie_publica, cadastro, calculo]}
                  referencia: {type: string, description: 'Campo e anexo; série e data da consulta; versão, documento e trecho'}
    SerieExterna:
      type: object
      required: [id, base, codigo, nome, publica]
      properties:
        id: {type: string, format: uuid}
        base: {enum: [IPEADATA, IBGE SIDRA, ANEEL, FGV]}
        codigo: {type: string}
        nome: {type: string}
        publica: {type: boolean}
        ultima_consulta: {type: [string, 'null'], format: date-time}
        situacao: {enum: [atualizada, desatualizada, indisponivel]}
        ultimo_mes: {oneOf: [{$ref: '#/components/schemas/Mes'}, {type: 'null'}]}
    ValorSerie:
      type: object
      required: [mes, valor, consultado_em]
      properties:
        mes: {$ref: '#/components/schemas/Mes'}
        valor: {type: number}
        consultado_em: {type: string, format: date-time}
    MarcoNovo:
      type: object
      required: [tipo, ocorrido_em]
      additionalProperties: false
      properties:
        tipo: {$ref: '#/components/schemas/TipoMarco'}
        ocorrido_em: {type: string, format: date-time}
        documento_sei: {type: [string, 'null']}
        prazo_concedido_dias: {type: [integer, 'null'], minimum: 1}
        observacao: {type: string}
    Marco:
      allOf:
        - $ref: '#/components/schemas/MarcoNovo'
        - type: object
          required: [id, atividade, registrado_por, registrado_em]
          properties:
            id: {type: string, format: uuid}
            atividade: {type: [string, 'null'], pattern: '^t([1-9]|1[0-6])$', description: 'Atividade do BPMN (t1 a t16)'}
            registrado_por: {type: string, format: uuid}
            registrado_em: {type: string, format: date-time}
    Prazo:
      type: object
      required: [id, ciclo_id, tipo, inicio, vencimento, contagem, dono, situacao]
      properties:
        id: {type: string, format: uuid}
        ciclo_id: {type: string, format: uuid}
        tipo: {enum: [pronunciamento, razoes_finais, deliberacao, procuradoria, recursal, inicio_conferencia_faturas, envio_faturas, publicidade, envio_alerj, memoria_calculo_blocos, resposta_diligencia, resposta_complementacao]}
        regra: {type: string, description: 'RN-PRZ-* que fixa o prazo'}
        norma: {type: [string, 'null'], description: 'N-P01-* e R-P01-*'}
        marco_inicial_id: {type: string, format: uuid}
        inicio: {type: string, format: date}
        duracao: {type: integer}
        contagem: {enum: [dias_uteis, dias_corridos]}
        vencimento: {type: string, format: date}
        dono: {$ref: '#/components/schemas/Dono'}
        situacao: {$ref: '#/components/schemas/SituacaoPrazo'}
        prorrogacoes:
          type: array
          items:
            type: object
            properties:
              dias: {type: integer}
              justificativa: {type: string}
              autorizado_por: {type: string, format: uuid}
              em: {type: string, format: date-time}
    Alerta:
      type: object
      required: [id, prazo_id, tipo, criado_em, lido]
      properties:
        id: {type: string, format: uuid}
        prazo_id: {type: [string, 'null'], format: uuid}
        ciclo_id: {type: string, format: uuid}
        tipo: {enum: [antes_do_vencimento, no_vencimento, vencido, sem_dono, data_base, serie_divergente, a_refazer]}
        mensagem: {type: string}
        criado_em: {type: string, format: date-time}
        lido: {type: boolean}
    Quesito:
      type: object
      required: [id, texto, autor_unidade, situacao]
      properties:
        id: {type: string, format: uuid}
        texto: {type: string}
        destinatario: {enum: [concessionaria, poder_concedente, verificador_independente]}
        autor_unidade: {type: string}
        situacao: {enum: [aberto, enviado, respondido]}
    DiligenciaNova:
      type: object
      required: [destinatario, prazo_dias_uteis]
      additionalProperties: false
      properties:
        destinatario: {enum: [concessionaria, poder_concedente, verificador_independente]}
        prazo_dias_uteis: {type: integer, minimum: 1}
        incluir_pendencias_validacao: {type: boolean, default: true}
    Diligencia:
      type: object
      required: [id, ciclo_id, destinatario, quesitos, peca, prazo]
      properties:
        id: {type: string, format: uuid}
        ciclo_id: {type: string, format: uuid}
        destinatario: {type: string}
        quesitos: {type: array, items: {$ref: '#/components/schemas/Quesito'}}
        peca: {$ref: '#/components/schemas/Peca'}
        prazo: {$ref: '#/components/schemas/Prazo'}
        reiteracoes: {type: integer, minimum: 0}
    ItemPauta:
      type: object
      required: [ciclo_id, apto, impedimentos]
      properties:
        ciclo_id: {type: string, format: uuid}
        processo_sei: {type: [string, 'null']}
        contrato: {type: string}
        relator_unidade: {type: string}
        razoes_finais_vencidas_em: {type: [string, 'null'], format: date}
        apto: {type: boolean}
        impedimentos: {type: array, items: {type: string}, description: 'Requisitos não atendidos (R-P01-01, R-P01-02, R-P01-03, R-P01-20)'}
        data_sessao: {type: [string, 'null'], format: date}
    ListaVerificacao:
      type: object
      required: [ciclo_id, pode_encerrar, itens]
      properties:
        ciclo_id: {type: string, format: uuid}
        pode_encerrar: {type: boolean}
        itens:
          type: array
          items:
            type: object
            required: [item, bloqueia, atendido]
            properties:
              item: {type: string}
              bloqueia: {type: boolean}
              atendido: {type: boolean}
              requisito: {type: [string, 'null']}
              evidencia: {type: [string, 'null'], description: 'Marco ou peça que atende'}
    ModeloNovo:
      type: object
      required: [codigo, nome, tipo_peca, corpo]
      additionalProperties: false
      properties:
        codigo: {type: string, examples: ['oficio-razoes-finais']}
        nome: {type: string}
        tipo_peca: {enum: [oficio_recebimento, oficio_complementacao, oficio_diligencia, oficio_reiteracao, notificacao_razoes_finais, oficio_acesso_autos, notificacao_deliberacao, oficio_alerj, oficio_pedido_faturas, certidao_ausencia_recurso, termo_encerramento, parecer_tecnico, parecer_juridico, relatorio, voto, deliberacao]}
        corpo: {type: string, description: 'Texto com campos {{ciclo.*}}, {{prazo.*}}, {{pendencias}}'}
        campos_obrigatorios: {type: array, items: {type: string}}
    ModeloDocumento:
      allOf:
        - $ref: '#/components/schemas/ModeloNovo'
        - type: object
          required: [id, versao]
          properties:
            id: {type: string, format: uuid}
            versao: {type: integer, minimum: 1}
            criado_em: {type: string, format: date-time}
    PecaNova:
      type: object
      required: [modelo_codigo]
      additionalProperties: false
      properties:
        modelo_codigo: {type: string}
        destinatario: {type: string}
        prazo_concedido_dias: {type: [integer, 'null'], minimum: 1}
    Peca:
      type: object
      required: [id, ciclo_id, tipo_peca, situacao, gerada_em]
      properties:
        id: {type: string, format: uuid}
        ciclo_id: {type: string, format: uuid}
        tipo_peca: {type: string}
        modelo_id: {type: [string, 'null'], format: uuid}
        modelo_versao: {type: [integer, 'null']}
        minuta_id: {type: [string, 'null'], format: uuid}
        situacao: {enum: [minuta, pronta_para_assinatura, juntada]}
        gerada_em: {type: string, format: date-time}
        documento_sei: {type: [string, 'null']}
        sha256: {type: [string, 'null']}
    Minuta:
      type: object
      required: [id, ciclo_id, tipo, situacao, trechos, citacoes]
      properties:
        id: {type: string, format: uuid}
        ciclo_id: {type: string, format: uuid}
        tipo: {$ref: '#/components/schemas/TipoMinuta'}
        situacao: {enum: [gerada, em_revisao, revisada]}
        gerada_em: {type: string, format: date-time}
        provedor_modelo: {type: string, description: 'Adaptador do INT-06 usado'}
        trechos:
          type: array
          items:
            type: object
            required: [id, texto]
            properties:
              id: {type: string}
              texto: {type: string}
              editado: {type: boolean}
        citacoes: {type: array, items: {$ref: '#/components/schemas/Citacao'}}
        taxa_edicao: {type: [number, 'null'], minimum: 0, maximum: 1}
    EdicaoMinuta:
      type: object
      required: [trecho_id, texto_novo]
      additionalProperties: false
      properties:
        trecho_id: {type: string}
        texto_novo: {type: string}
        motivo: {type: string}
    Citacao:
      type: object
      required: [id, fonte_tipo, fonte_id, trecho, situacao]
      properties:
        id: {type: string}
        fonte_tipo: {enum: [norma, contrato, deliberacao, peca]}
        fonte_id: {type: string, examples: ['N-P01-07']}
        dispositivo: {type: [string, 'null']}
        trecho: {type: string}
        situacao: {enum: [valida, invalida, nao_verificada]}
        motivo: {type: [string, 'null'], enum: [fonte_inexistente, dispositivo_inexistente, trecho_nao_achado, fora_de_vigencia, null]}
        verificada_em: {type: [string, 'null'], format: date-time}
    RemessaRegistro:
      type: object
      required: [id, contrato_id, competencia, recebida_em, faturas, situacao]
      properties:
        id: {type: string, format: uuid}
        contrato_id: {type: string, format: uuid}
        competencia: {$ref: '#/components/schemas/Mes'}
        recebida_em: {type: string, format: date-time}
        sha256: {type: string}
        faturas: {type: integer}
        situacao: {enum: [recebida, em_conferencia, conferida, sem_regra_de_aplicacao]}
        divergencias: {type: [integer, 'null']}
        soma_diferencas: {type: [number, 'null']}
    DivergenciaFatura:
      type: object
      required: [id, codigo_economia, categoria, consumo, valor_cobrado, valor_esperado, diferenca]
      properties:
        id: {type: string, format: uuid}
        codigo_economia: {type: string}
        mes: {$ref: '#/components/schemas/Mes'}
        categoria: {type: string}
        faixa: {type: [string, 'null']}
        consumo: {type: number}
        valor_cobrado: {type: number}
        valor_esperado: {type: number}
        diferenca: {type: number}
        situacao: {enum: [em_analise, procedente, improcedente]}
        quantidade: {type: integer, description: 'Quando agrupada'}
    Indicador:
      type: object
      required: [id, nome, unidade, linha_base]
      properties:
        id: {type: string, pattern: '^I-P01-(0[1-9]|10)$'}
        nome: {type: string}
        unidade: {type: string}
        frequencia: {type: string}
        linha_base: {type: number}
        metas: {type: array, items: {type: object, properties: {fase: {type: integer}, valor: {type: number}}}}
        ultima_medicao: {oneOf: [{$ref: '#/components/schemas/MedicaoIndicador'}, {type: 'null'}]}
        hipotese: {type: boolean, description: 'true para horas (I-P01-02) até a calibração com servidores'}
    MedicaoIndicador:
      type: object
      required: [indicador_id, periodo, valor, calculado_em]
      properties:
        indicador_id: {type: string}
        periodo: {type: string}
        valor: {type: number}
        n_casos: {type: integer}
        calculado_em: {type: string, format: date-time}
    TesteRequisito:
      type: object
      required: [requisito, ciclo_id, resultado, executado_em]
      properties:
        requisito: {type: string, pattern: '^R-P01-(0[1-9]|1[0-9]|20)$'}
        ciclo_id: {type: string, format: uuid}
        resultado: {$ref: '#/components/schemas/ResultadoTeste'}
        detalhe: {type: string, examples: ['99 dc (máx. 30)']}
        executado_em: {type: string, format: date-time}
    ControleQualidade:
      type: object
      required: [id, indicador, valor]
      properties:
        id: {type: string, pattern: '^Q-P01-0[1-4]$'}
        indicador: {type: string}
        valor: {type: [number, 'null']}
        meta: {type: string}
        periodo: {type: string}
    UsuarioNovo:
      type: object
      required: [nome, email, perfis]
      additionalProperties: false
      properties:
        nome: {type: string}
        email: {type: string, format: email}
        perfis: {type: array, minItems: 1, items: {$ref: '#/components/schemas/CodigoPerfil'}}
        unidade: {type: [string, 'null'], description: 'Unidade interna (CAPET, PROC, SCEXEC, CONS-02...)'}
        concessionaria_cnpj: {type: [string, 'null'], pattern: '^\d{14}$', description: 'Obrigatório para PER-CON'}
    Usuario:
      allOf:
        - $ref: '#/components/schemas/UsuarioNovo'
        - type: object
          required: [id, ativo]
          properties:
            id: {type: string, format: uuid}
            ativo: {type: boolean}
            ultimo_acesso: {type: [string, 'null'], format: date-time}
    Perfil:
      type: object
      required: [codigo, nome, permissoes]
      properties:
        codigo: {$ref: '#/components/schemas/CodigoPerfil'}
        nome: {type: string}
        permissoes: {type: array, items: {type: string, description: operationId}}
    Integracao:
      type: object
      required: [id, nome, ativa, situacao]
      properties:
        id: {type: string, pattern: '^INT-0[1-8]$'}
        nome: {type: string}
        ativa: {type: boolean}
        situacao: {enum: [ok, degradada, indisponivel, nao_configurada]}
        ultima_execucao: {type: [string, 'null'], format: date-time}
        configuracao: {type: object}
    Feriado:
      type: object
      required: [data, nome, tipo]
      properties:
        data: {type: string, format: date}
        nome: {type: string}
        tipo: {enum: [nacional, estadual, municipal, movel, ponto_facultativo]}
        ato: {type: [string, 'null'], description: 'Decreto do ponto facultativo'}
    RegistroAuditoria:
      type: object
      required: [id, em, usuario_id, acao, entidade, entidade_id]
      properties:
        id: {type: string, format: uuid}
        em: {type: string, format: date-time}
        usuario_id: {type: string, format: uuid}
        perfil: {$ref: '#/components/schemas/CodigoPerfil'}
        acao: {type: string, description: operationId}
        entidade: {type: string}
        entidade_id: {type: string}
        antes_sha256: {type: [string, 'null']}
        depois_sha256: {type: [string, 'null']}
        correlacao_id: {type: string}
    Tarefa:
      type: object
      required: [id, tipo, situacao]
      properties:
        id: {type: string, format: uuid}
        tipo: {enum: [validacao, minuta, atualizacao_series, conferencia_remessa, auditoria_continua]}
        situacao: {enum: [agendada, em_execucao, concluida, falhou]}
        resultado_url: {type: [string, 'null']}
        erro: {oneOf: [{$ref: '#/components/schemas/Problema'}, {type: 'null'}]}
