openapi: 3.1.0
info:
  title: Reajusta — API do sistema de reajuste tarifário anual (P01)
  version: 0.1.0
  summary: Ciclos, pleitos, validação, cadastro, apuração, séries, prazos, peças, minutas, faturas, indicadores e usuários.
  description: |
    Contrato da API do Reajusta. Guia em `especificacao/07_CONTRATOS_API.md`; regras em `08_REGRAS_NEGOCIO.md`.

    Convenções:
    - Caminhos e campos em português, sem acento nos identificadores; campos JSON em `snake_case`.
    - Datas `AAAA-MM-DD`, meses `AAAA-MM`, instantes ISO 8601 com fuso (`2026-01-02T10:00:00-03:00`).
    - Números com ponto decimal; percentuais em pontos percentuais (3.967 = 3,967%). O servidor lê os números do
      pleito sem perda das casas escritas (RN-NUM-02).
    - Erros em `application/problem+json` (RFC 9457), com os membros de extensão `codigo` e `erros`.
    - Listas paginadas por `pagina` e `por_pagina`.
    - `x-perfis`: perfis autorizados (PER-* de `01_VISAO_ESCOPO.md`). `x-caso-de-uso`: UC atendido. `x-requisitos`: RF.
    - PER-CON só vê ciclos, pleitos, contratos e remessas da própria concessionária; recurso de outra responde 404.
servers:
  - url: /api/v1
tags:
  - name: ciclos
  - name: pleitos
  - name: contratos
  - name: apuracoes
  - name: series
  - name: prazos
  - name: pecas
  - name: minutas
  - name: faturas
  - name: indicadores
  - name: administracao
security:
  - sessao: []
  - bearer: []

paths:
  # ------------------------------------------------------------------ ciclos
  /ciclos:
    get:
      tags: [ciclos]
      operationId: listarCiclos
      summary: Fila de ciclos com situação, dono, prazo e idade (TL-01)
      x-perfis: [PER-ANA, PER-GCA, PER-PRO, PER-SEC, PER-REL, PER-GES, PER-CON]
      x-caso-de-uso: UC-08
      x-requisitos: [RF-PRZ-09]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
        - {name: situacao, in: query, schema: {$ref: '#/components/schemas/SituacaoCiclo'}}
        - {name: contrato_id, in: query, schema: {type: string, format: uuid}}
        - {name: unidade_dona, in: query, schema: {type: string}, description: 'Ex.: CAPET, PROC, SCEXEC, CONS-02'}
        - {name: ordenar, in: query, schema: {enum: [idade, prazo, vigencia]}}
      responses:
        '200':
          description: Página de ciclos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    properties:
                      itens: {type: array, items: {$ref: '#/components/schemas/CicloResumo'}}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
    post:
      tags: [ciclos]
      operationId: abrirCiclo
      summary: Abrir o ciclo de reajuste de um contrato e vincular o processo SEI
      x-perfis: [PER-SEC]
      x-caso-de-uso: UC-08
      x-requisitos: [RF-PLE-06]
      description: Também é aberto automaticamente no primeiro envio de pleito sem ciclo aberto para o contrato e a vigência.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CicloNovo'}
      responses:
        '201':
          description: Ciclo aberto
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ciclo'}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '403': {$ref: '#/components/responses/SemPermissao'}
        '409': {$ref: '#/components/responses/Conflito'}
  /ciclos/{ciclo_id}:
    parameters:
      - $ref: '#/components/parameters/CicloId'
    get:
      tags: [ciclos]
      operationId: obterCiclo
      summary: Detalhe do ciclo com marcos, prazos, peças, pendências e apuração (TL-02)
      x-perfis: [PER-ANA, PER-GCA, PER-PRO, PER-SEC, PER-REL, PER-GES, PER-CON]
      x-caso-de-uso: UC-08
      x-requisitos: [RF-PLE-06, RF-PRZ-01]
      responses:
        '200':
          description: Ciclo
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ciclo'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
    patch:
      tags: [ciclos]
      operationId: atualizarCiclo
      summary: Vincular ou corrigir o número do processo SEI
      x-perfis: [PER-SEC]
      x-caso-de-uso: UC-08
      x-requisitos: [RF-PLE-06]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                processo_sei: {$ref: '#/components/schemas/ProcessoSei'}
      responses:
        '200':
          description: Ciclo atualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ciclo'}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '412': {$ref: '#/components/responses/PreCondicaoFalhou'}

  # ------------------------------------------------------------------ pleitos
  /pleitos/validacao-previa:
    post:
      tags: [pleitos]
      operationId: validarPleitoPreviamente
      summary: Validação prévia do pacote, com as mesmas regras e sem registro
      description: |
        Aplica V01 a V12 com o mesmo motor do envio e devolve o resultado em modo `previa`. Nada é guardado: nem o
        pacote, nem o resultado, nem a consulta entra na base de conferência cruzada (RF-PLE-05).
      x-perfis: [PER-CON, PER-ANA]
      x-caso-de-uso: UC-02
      x-requisitos: [RF-PLE-05, RF-PLE-02, RF-PLE-03]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/PacotePleito'}
          application/json:
            schema: {$ref: './pleito_reajuste.schema.json'}
      responses:
        '200':
          description: Resultado da validação prévia (pode conter erros de V01 a V12; isso não é erro HTTP)
          content:
            application/json:
              schema: {$ref: './resultado_validacao.schema.json'}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '413': {$ref: '#/components/responses/MuitoGrande'}
        '415': {$ref: '#/components/responses/TipoNaoSuportado'}
        '422': {$ref: '#/components/responses/CampoForaDoLayout'}
        '429': {$ref: '#/components/responses/MuitasRequisicoes'}
  /ciclos/{ciclo_id}/pleitos:
    parameters:
      - $ref: '#/components/parameters/CicloId'
    get:
      tags: [pleitos]
      operationId: listarPleitosDoCiclo
      summary: Envios do ciclo (rodadas) com a decisão de cada validação
      x-perfis: [PER-CON, PER-ANA, PER-SEC, PER-REL, PER-PRO, PER-GES]
      x-caso-de-uso: UC-02
      x-requisitos: [RF-PLE-03]
      responses:
        '200':
          description: Pleitos do ciclo, do mais recente ao mais antigo
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PleitoRegistro'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
    post:
      tags: [pleitos]
      operationId: enviarPleito
      summary: Enviar o pleito (pacote no layout 0.1) e disparar a validação registrada
      description: |
        Idempotente pelo cabeçalho `Idempotency-Key`. O pacote é guardado com o SHA-256 de cada arquivo, conferido
        contra `anexos[].sha256` do pleito. A validação (UC-02, com UC-03) roda logo após o registro; a resposta traz
        o resultado quando ele termina em até 60 s (RNF-13), senão `202` com o endereço do resultado.
      x-perfis: [PER-CON, PER-SEC]
      x-caso-de-uso: UC-01
      x-requisitos: [RF-PLE-01, RF-PLE-02, RF-PLE-03, RF-PLE-06, RF-SER-02]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/PacotePleito'}
            encoding:
              pleito: {contentType: application/json}
      responses:
        '201':
          description: Pleito registrado e validado
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PleitoRegistro'}
        '200':
          description: Repetição de um envio com a mesma chave de idempotência e o mesmo conteúdo; devolve o registro original
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PleitoRegistro'}
        '202':
          description: Pleito registrado; validação em andamento
          headers:
            Location: {schema: {type: string}, description: 'Endereço de GET /pleitos/{pleito_id}/resultado'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PleitoRegistro'}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '403': {$ref: '#/components/responses/SemPermissao'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '409': {$ref: '#/components/responses/Conflito'}
        '413': {$ref: '#/components/responses/MuitoGrande'}
        '415': {$ref: '#/components/responses/TipoNaoSuportado'}
        '422': {$ref: '#/components/responses/CampoForaDoLayout'}
  /pleitos/{pleito_id}:
    parameters:
      - $ref: '#/components/parameters/PleitoId'
    get:
      tags: [pleitos]
      operationId: obterPleito
      summary: Registro do pleito, com o conteúdo no layout e os anexos
      x-perfis: [PER-CON, PER-ANA, PER-SEC, PER-REL, PER-PRO]
      x-caso-de-uso: UC-02
      x-requisitos: [RF-PLE-01]
      responses:
        '200':
          description: Pleito
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PleitoRegistro'
                  - type: object
                    properties:
                      conteudo: {$ref: './pleito_reajuste.schema.json'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
  /pleitos/{pleito_id}/resultado:
    parameters:
      - $ref: '#/components/parameters/PleitoId'
    get:
      tags: [pleitos]
      operationId: obterResultadoValidacao
      summary: Resultado da validação V01 a V12 (TL-04)
      x-perfis: [PER-CON, PER-ANA, PER-SEC, PER-REL, PER-PRO]
      x-caso-de-uso: UC-02
      x-requisitos: [RF-PLE-03, RF-SER-02, RF-SER-04]
      responses:
        '200':
          description: Último resultado registrado do pleito
          content:
            application/json:
              schema: {$ref: './resultado_validacao.schema.json'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
  /pleitos/{pleito_id}/revalidacao:
    parameters:
      - $ref: '#/components/parameters/PleitoId'
    post:
      tags: [pleitos]
      operationId: revalidarPleito
      summary: Refazer a validação depois de a fonte externa voltar (itens "a refazer")
      x-perfis: [PER-ANA]
      x-caso-de-uso: UC-03
      x-requisitos: [RF-SER-04, RF-PLE-03]
      responses:
        '201':
          description: Novo resultado, ligado ao anterior pelo campo `substitui`
          content:
            application/json:
              schema: {$ref: './resultado_validacao.schema.json'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '409': {$ref: '#/components/responses/Conflito'}
  /pleitos/{pleito_id}/devolucao:
    parameters:
      - $ref: '#/components/parameters/PleitoId'
    post:
      tags: [pleitos]
      operationId: devolverPleito
      summary: Confirmar a devolução do pleito com pendências e gerar a minuta do ofício de complementação
      description: Só para resultado com decisão `devolver`. Gera a peça por modelo (RF-DOC-01) e abre o prazo de resposta.
      x-perfis: [PER-ANA]
      x-caso-de-uso: UC-04
      x-requisitos: [RF-PLE-04, RF-DOC-03]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                prazo_resposta_dias_uteis: {type: integer, minimum: 1}
                observacao: {type: string}
      responses:
        '201':
          description: Devolução registrada; peça e prazo criados
          content:
            application/json:
              schema:
                type: object
                required: [peca, prazo]
                properties:
                  peca: {$ref: '#/components/schemas/Peca'}
                  prazo: {$ref: '#/components/schemas/Prazo'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '409': {$ref: '#/components/responses/Conflito'}
  /pleitos/{pleito_id}/anexos/{arquivo}:
    parameters:
      - $ref: '#/components/parameters/PleitoId'
      - {name: arquivo, in: path, required: true, schema: {type: string}}
    get:
      tags: [pleitos]
      operationId: baixarAnexoPleito
      summary: Baixar um anexo do pacote (evidência)
      x-perfis: [PER-CON, PER-ANA, PER-PRO, PER-REL]
      x-caso-de-uso: UC-05
      x-requisitos: [RF-PLE-01, RF-CAL-05]
      responses:
        '200':
          description: Arquivo, com o SHA-256 no cabeçalho
          headers:
            Digest: {schema: {type: string}, description: 'sha-256=<base64>'}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NaoEncontrado'}

  # ------------------------------------------------------------------ contratos
  /contratos:
    get:
      tags: [contratos]
      operationId: listarContratos
      summary: Contratos com a versão contratual vigente
      x-perfis: [PER-GCA, PER-ANA, PER-GES, PER-SEC, PER-REL, PER-PRO, PER-CON]
      x-caso-de-uso: UC-06
      x-requisitos: [RF-CAD-01]
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página de contratos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    properties:
                      itens: {type: array, items: {$ref: '#/components/schemas/Contrato'}}
    post:
      tags: [contratos]
      operationId: criarContrato
      summary: Cadastrar contrato (sem versões publicadas)
      x-perfis: [PER-GCA]
      x-caso-de-uso: UC-06
      x-requisitos: [RF-CAD-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContratoNovo'}
      responses:
        '201':
          description: Contrato criado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contrato'}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '403': {$ref: '#/components/responses/SemPermissao'}
        '409': {$ref: '#/components/responses/Conflito'}
  /contratos/{contrato_id}:
    parameters:
      - $ref: '#/components/parameters/ContratoId'
    get:
      tags: [contratos]
      operationId: obterContrato
      summary: Contrato
      x-perfis: [PER-GCA, PER-ANA, PER-GES, PER-SEC, PER-REL, PER-PRO, PER-CON]
      x-caso-de-uso: UC-06
      x-requisitos: [RF-CAD-01]
      responses:
        '200':
          description: Contrato
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contrato'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
  /contratos/{contrato_id}/cadastro:
    parameters:
      - $ref: '#/components/parameters/ContratoId'
    get:
      tags: [contratos]
      operationId: obterCadastroPublicado
      summary: Cadastro de parâmetros publicado, no formato cadastro_contrato.schema.json
      description: É o que a concessionária usa para montar o pleito (siglas, códigos, versão contratual). Só versões publicadas.
      x-perfis: [PER-CON, PER-GCA, PER-ANA, PER-GES]
      x-caso-de-uso: UC-01
      x-requisitos: [RF-CAD-01, RF-CAD-02, RF-PLE-05]
      responses:
        '200':
          description: Cadastro
          content:
            application/json:
              schema: {$ref: './cadastro_contrato.schema.json'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
  /contratos/{contrato_id}/versoes:
    parameters:
      - $ref: '#/components/parameters/ContratoId'
    get:
      tags: [contratos]
      operationId: listarVersoes
      summary: Versões contratuais, com situação e herança (TL-06)
      x-perfis: [PER-GCA, PER-ANA, PER-GES, PER-PRO, PER-REL]
      x-caso-de-uso: UC-06
      x-requisitos: [RF-CAD-01]
      responses:
        '200':
          description: Versões, da mais antiga à mais recente
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/VersaoRegistro'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
    post:
      tags: [contratos]
      operationId: criarVersao
      summary: Criar versão contratual em rascunho, herdando da anterior
      x-perfis: [PER-GCA]
      x-caso-de-uso: UC-06
      x-requisitos: [RF-CAD-01, RF-CAD-02, RF-CAD-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './cadastro_contrato.schema.json#/$defs/versao'}
      responses:
        '201':
          description: Versão criada em rascunho, com o resultado da conferência dos trechos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersaoRegistro'}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '403': {$ref: '#/components/responses/SemPermissao'}
        '409': {$ref: '#/components/responses/Conflito'}
  /contratos/{contrato_id}/versoes/{versao}:
    parameters:
      - $ref: '#/components/parameters/ContratoId'
      - $ref: '#/components/parameters/Versao'
    get:
      tags: [contratos]
      operationId: obterVersao
      summary: Versão contratual, como cadastrada ou resolvida com a herança
      x-perfis: [PER-GCA, PER-ANA, PER-GES, PER-PRO, PER-REL, PER-CON]
      x-caso-de-uso: UC-06
      x-requisitos: [RF-CAD-01]
      parameters:
        - {name: resolvida, in: query, schema: {type: boolean, default: false}, description: 'true aplica a herança (RN-CAD-01)'}
      responses:
        '200':
          description: Versão
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersaoRegistro'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
    put:
      tags: [contratos]
      operationId: substituirVersaoRascunho
      summary: Alterar versão em rascunho (versão publicada não muda; cria-se outra)
      x-perfis: [PER-GCA]
      x-caso-de-uso: UC-06
      x-requisitos: [RF-CAD-01, RF-CAD-02, RF-CAD-03]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './cadastro_contrato.schema.json#/$defs/versao'}
      responses:
        '200':
          description: Versão atualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersaoRegistro'}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '409': {$ref: '#/components/responses/Conflito'}
        '412': {$ref: '#/components/responses/PreCondicaoFalhou'}
  /contratos/{contrato_id}/versoes/{versao}/conferencia-trechos:
    parameters:
      - $ref: '#/components/parameters/ContratoId'
      - $ref: '#/components/parameters/Versao'
    post:
      tags: [contratos]
      operationId: conferirTrechos
      summary: Conferir cada trecho literal da versão no texto da base do Especialista (V02)
      x-perfis: [PER-GCA, PER-ANA]
      x-caso-de-uso: UC-06
      x-requisitos: [RF-CAD-02]
      responses:
        '200':
          description: Resultado por fonte
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConferenciaTrechos'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '503': {$ref: '#/components/responses/FonteIndisponivel'}
  /contratos/{contrato_id}/versoes/{versao}/publicacao:
    parameters:
      - $ref: '#/components/parameters/ContratoId'
      - $ref: '#/components/parameters/Versao'
    post:
      tags: [contratos]
      operationId: publicarVersao
      summary: Publicar a versão (exige todos os trechos achados)
      x-perfis: [PER-GCA]
      x-caso-de-uso: UC-06
      x-requisitos: [RF-CAD-01, RF-CAD-02]
      responses:
        '200':
          description: Versão publicada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersaoRegistro'}
        '409': {$ref: '#/components/responses/Conflito'}
        '422': {$ref: '#/components/responses/RegraDeNegocio'}
  /contratos/{contrato_id}/historico:
    parameters:
      - $ref: '#/components/parameters/ContratoId'
    get:
      tags: [contratos]
      operationId: obterHistoricoContrato
      summary: Ciclos encadeados do contrato com declarado, refeito e deliberado (TL-07)
      x-perfis: [PER-ANA, PER-GES, PER-GCA, PER-PRO, PER-REL]
      x-caso-de-uso: UC-07
      x-requisitos: [RF-CAL-06]
      responses:
        '200':
          description: Histórico
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CicloHistorico'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}

  # ------------------------------------------------------------------ apuracoes
  /pleitos/{pleito_id}/apuracao:
    parameters:
      - $ref: '#/components/parameters/PleitoId'
    get:
      tags: [apuracoes]
      operationId: obterApuracaoDoPleito
      summary: Apuração do motor para o pleito
      x-perfis: [PER-ANA, PER-PRO, PER-REL, PER-CON]
      x-caso-de-uso: UC-03
      x-requisitos: [RF-CAL-01, RF-CAL-02, RF-CAL-03, RF-CAL-04]
      responses:
        '200':
          description: Apuração
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Apuracao'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
  /apuracoes/{apuracao_id}/memoria:
    parameters:
      - {name: apuracao_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [apuracoes]
      operationId: obterMemoriaCalculo
      summary: Memória de cálculo com a origem de cada número (TL-05)
      x-perfis: [PER-ANA, PER-PRO, PER-REL]
      x-caso-de-uso: UC-05
